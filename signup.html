<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankApp | Sign Up</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/signup.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>Sign Up Here</h1>
            <p>Create a new account to access the bank and exam portals.</p>
        </section>

        <nav>
            <a href="index.html" class="secondary">Home</a>
            <a href="signin.html">Sign In</a>
        </nav>

        <hr>

        <form id="signupform">
            <input type="text" placeholder="Enter username" id="uname" required>
            <input type="email" placeholder="Enter email" id="uemail" required>
            <input type="password" placeholder="Enter password" id="upass" required>
            <input type="password" placeholder="Confirm password" id="ucpass" required>
            <div class="actions">
                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
                <a href="index.html" class="btn secondary">Cancel</a>
            </div>
        </form>

    </main>

    <script>
        document.getElementById("signupform").addEventListener("submit",function(event)
        {
            event.preventDefault(); //to hold the variable value on console
            let uname=document.getElementById("uname").value;
            let uemail=document.getElementById("uemail").value;
            let upass=document.getElementById("upass").value;
            let ucpass=document.getElementById("ucpass").value;
            console.log(uname,uemail,upass,ucpass);

            let user=({uname:uname,uemail:uemail,upass:upass});
            let userlist=JSON.parse(localStorage.getItem("userlist"))||[];
           
            userlist.push(user);
            console.log(userlist);
            
            if(upass===ucpass)
            {
                // localStorage.setItem("uname",uname);
                // localStorage.setItem("uemail",uemail);
                // localStorage.setItem("upass",upass);
                localStorage.setItem("userlist",JSON.stringify(userlist));

                alert("Registration successully done!!!");
                window.location.href="signin.html";
                
            }
            else
            {
                alert("Password and confirm password dose not match Try again!!!")
            }

              
        });
    </script>
    
</body>
</html>
