<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankApp | Sign In</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/signin.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <h1>Sign In Here</h1>
            <p>Access your account and continue to the exam or bank portal.</p>
        </section>

        <nav>
            <a href="index.html" class="secondary">Home</a>
            <a href="signup.html">Sign Up</a>
        </nav>

        <hr>

        <form id="signinform">
            <input type="email" placeholder="Enter email" id="uemail" required>
            <input type="password" placeholder="Enter password" id="upass" required>
            <div class="actions">
                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
                <a href="index.html" class="btn secondary">Cancel</a>
            </div>
        </form>
    </main>
    <script>
        document.getElementById("signinform").addEventListener("submit",function(event)
    {
        event.preventDefault();
        let uemail=document.getElementById("uemail").value;
        let upass=document.getElementById("upass").value;
        console.log(uemail,upass);
        // let stored_uemail=localStorage.getItem("uemail");
        // let stored_upass=localStorage.getItem("upass");

        let userlist=JSON.parse(localStorage.getItem("userlist"))||[]; //json.parse help  push array 

        
        let user=userlist.find(i=>i.uemail===uemail && i.upass===upass);
        if(user) // if(uemail===stored_uemail&& upass===stored_upass)
        {
            localStorage.setItem('currentuser',JSON.stringify(user));
            //alert("Login successfully!!!");
            let option=confirm("Do you want to start exam portal then click ok..");
            if(option)
            {
            window.location.href="examapp.html";
                
            }
            else{
            window.location.href="bankapp.html";
            }
            
        }
        else
        {
            alert("Login failed...Please check email and password!!");
        }
        

    });
    </script>
</body>
</html>
